{% extends "base.html" %}

{% block title %}
Admin Dashboard
{% endblock %}

{% block content %}

<h2 class="text-center mb-4">
    👨‍💼 Admin Dashboard
</h2>

<div class="row">

    <div class="col-md-4 mb-4">

        <div class="card shadow text-center">

            <div class="card-body">

                <i class="bi bi-airplane-fill display-3 text-primary"></i>

                <h4 class="mt-3">Flights</h4>

                <p>Manage all flights.</p>

                <a href="/admin/flights"
                   class="btn btn-primary">
                    View Flights
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4 mb-4">

        <div class="card shadow text-center">

            <div class="card-body">

                <i class="bi bi-ticket-perforated-fill display-3 text-success"></i>

                <h4 class="mt-3">Bookings</h4>

                <p>View all bookings.</p>

                <a href="/admin/bookings"
                   class="btn btn-success">
                    View Bookings
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4 mb-4">

        <div class="card shadow text-center">

            <div class="card-body">

                <i class="bi bi-people-fill display-3 text-warning"></i>

                <h4 class="mt-3">Users</h4>

                <p>View registered users.</p>

                <a href="/admin/users"
                   class="btn btn-warning">
                    View Users
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
