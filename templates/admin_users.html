{% extends "base.html" %}

{% block title %}
Users
{% endblock %}

{% block content %}

<h2 class="mb-4 text-center">
    👥 Registered Users
</h2>

<table class="table table-bordered table-hover">

    <thead class="table-dark">

        <tr>

            <th>User ID</th>
            <th>Username</th>
            <th>Role</th>

        </tr>

    </thead>

    <tbody>

    {% for user in users %}

        <tr>

            <td>{{ user[0] }}</td>
            <td>{{ user[1] }}</td>
            <td>
                <span class="badge bg-info">
                    {{ user[2] }}
                </span>
            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
