{% extends "base.html" %}

{% block title %}
Book Ticket
{% endblock %}

{% block content %}

<h2>Book Ticket</h2>

<div class="card p-4">

    <p><strong>Flight ID:</strong> {{ flight[0] }}</p>
    <p><strong>Source:</strong> {{ flight[1] }}</p>
    <p><strong>Destination:</strong> {{ flight[2] }}</p>
    <p><strong>Available Seats:</strong> {{ flight[3] }}</p>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Passenger Name
            </label>

            <input
                type="text"
                class="form-control"
                name="name"
                required>

        </div>

        <button class="btn btn-success">
            Confirm Booking
        </button>

    </form>

</div>

{% endblock %}
