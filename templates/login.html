{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-dark text-white text-center">
                <h3>User Login</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Username</label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary">
                            Login
                        </button>
                    </div>

                </form>

            </div>

            <div class="card-footer text-center">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
