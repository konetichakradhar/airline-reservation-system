{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

<div class="container">

<div class="card shadow">

<div class="card-body">

<div class="text-center">

<i class="bi bi-person-circle"
   style="font-size:90px;color:#0d6efd;"></i>

<h2 class="mt-3">{{ user[0] }}</h2>

<span class="badge bg-primary">
{{ user[1]|capitalize }}
</span>

</div>

<hr>

<div class="row text-center">

<div class="col-md-4">

<div class="card border-success">

<div class="card-body">

<h2>{{ stats[0] }}</h2>

<p>Total Bookings</p>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card border-primary">

<div class="card-body">

<h2>{{ stats[1] or 0 }}</h2>

<p>Confirmed</p>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card border-danger">

<div class="card-body">

<h2>{{ stats[2] or 0 }}</h2>

<p>Cancelled</p>

</div>

</div>

</div>

</div>

<br>

<div class="text-center">

<a href="/history"
class="btn btn-primary">

<i class="bi bi-clock-history"></i>
Booking History

</a>

<a href="/bookings"
class="btn btn-success">

<i class="bi bi-ticket"></i>
My Bookings

</a>

</div>

</div>

</div>

</div>

{% endblock %}
